<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bouncing RGB Balls</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .instructions {
        position: fixed;
        right: 16px;
        bottom: 14px;
        color: #888;
        font: 13px/1.5 system-ui, sans-serif;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="Bouncing colored balls"></canvas>
    <div class="instructions">R · red &nbsp; G · green &nbsp; B · blue &nbsp; Space · clear</div>
    <script>
      const canvas = document.querySelector("#scene");
      const context = canvas.getContext("2d");
      const colors = { r: "#ff3b30", g: "#34c759", b: "#0a84ff" };
      const balls = [];
      let width = 0;
      let height = 0;
      let pixelRatio = 1;

      function resize() {
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        for (const ball of balls) {
          ball.x = Math.min(Math.max(ball.x, ball.radius), width - ball.radius);
          ball.y = Math.min(Math.max(ball.y, ball.radius), height - ball.radius);
        }
      }

      function addBall(color) {
        const radius = 18 + Math.random() * 14;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 3;
        balls.push({
          x: radius + Math.random() * Math.max(0, width - radius * 2),
          y: radius + Math.random() * Math.max(0, height - radius * 2),
          radius,
          color,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed
        });
      }

      function animate() {
        context.clearRect(0, 0, width, height);
        for (const ball of balls) {
          ball.x += ball.vx;
          ball.y += ball.vy;

          if (ball.x - ball.radius < 0 || ball.x + ball.radius > width) {
            ball.vx *= -1;
            ball.x = Math.min(Math.max(ball.x, ball.radius), width - ball.radius);
          }
          if (ball.y - ball.radius < 0 || ball.y + ball.radius > height) {
            ball.vy *= -1;
            ball.y = Math.min(Math.max(ball.y, ball.radius), height - ball.radius);
          }

          context.beginPath();
          context.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
          context.fillStyle = ball.color;
          context.fill();
        }
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (key === " ") {
          event.preventDefault();
          balls.length = 0;
        } else if (colors[key]) {
          addBall(colors[key]);
        }
      });

      resize();
      animate();
    </script>
  </body>
</html>
