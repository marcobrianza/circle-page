<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Circle</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .circle {
        width: min(160px, 40vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="circle" aria-label="White circle"></main>
  </body>
</html>
